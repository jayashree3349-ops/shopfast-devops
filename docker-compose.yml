services:

  backend:
    build:
      context: ./backend
    image: shopfast/backend:v1
    container_name: shopfast-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/shopfast?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopfast-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  mongodb:
    image: mongo:7
    container_name: shopfast-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: shopfast
    volumes:
      - mongodb-data:/data/db
    networks:
      - shopfast-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5

  redis:
    image: redis:7-alpine
    container_name: shopfast-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - shopfast-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  frontend:
    build:
      context: ./frontend
    image: shopfast/frontend:v1
    container_name: shopfast-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shopfast-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

networks:
  shopfast-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
